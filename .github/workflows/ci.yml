name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check
        working-directory: rust

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
        working-directory: rust

      - name: Run tests (including proptest)
        run: cargo test --all
        working-directory: rust

      - name: Build examples
        run: cargo build --examples
        working-directory: rust

  go:
    name: Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Run Go tests
        run: go test ./...
        working-directory: go

      - name: Short Go fuzzing (decode + roundtrip)
        continue-on-error: true   # Finding crashes is valuable, not a failure
        run: |
          echo "Running short Go fuzzing..."
          go test -fuzz=FuzzDecodeRaw -fuzztime=30s ./... || true
          go test -fuzz=FuzzRoundtrip -fuzztime=30s ./... || true
        working-directory: go

  fuzz-check:
    name: Fuzz Setup Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (nightly)
        uses: dtolnay/rust-toolchain@nightly

      - name: Check that Rust fuzz targets still compile
        run: |
          cargo install cargo-fuzz
          cargo +nightly fuzz check decode_raw
          cargo +nightly fuzz check roundtrip
        working-directory: rust/fuzz