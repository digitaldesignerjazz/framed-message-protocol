name: Scheduled Fuzzing

on:
  schedule:
    # Run every Sunday at 03:00 UTC
    - cron: '0 3 * * 0'
  workflow_dispatch:

jobs:
  rust-fuzz:
    name: Rust Fuzzing
    runs-on: ubuntu-latest
    concurrency:
      group: rust-fuzzing
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust Nightly
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz

      - name: Run Rust decode_raw fuzzer
        working-directory: rust/fuzz
        run: |
          cargo +nightly fuzz run decode_raw -- \
            -max_total_time=2700 \
            -jobs=2 \
            -rss_limit_mb=1024

      - name: Upload Rust crash artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rust-fuzz-crash-${{ github.run_id }}
          path: |
            rust/fuzz/artifacts/**
            rust/fuzz/corpus/**
          retention-days: 90

  go-fuzz:
    name: Go Fuzzing
    runs-on: ubuntu-latest
    needs: rust-fuzz
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Run Go fuzz targets (longer session)
        working-directory: go
        run: |
          go test -fuzz=FuzzDecodeRaw -fuzztime=5m ./... || true
          go test -fuzz=FuzzRoundtrip -fuzztime=5m ./... || true

      - name: Upload Go fuzz artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: go-fuzz-crash-${{ github.run_id }}
          path: go/**
          retention-days: 30