name: Scheduled Fuzzing

on:
  schedule:
    - cron: '0 3 * * 0'
  workflow_dispatch:

jobs:
  rust-fuzz:
    name: Rust Fuzzing (decode_raw)
    runs-on: ubuntu-latest
    concurrency:
      group: rust-fuzzing
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust Nightly
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz

      - name: Run long Rust fuzz session
        continue-on-error: true
        working-directory: rust/fuzz
        run: |
          cargo +nightly fuzz run decode_raw -- \
            -max_total_time=2700 \
            -jobs=2 \
            -rss_limit_mb=1024

      - name: Upload Rust crash artifacts (if any found)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rust-fuzz-artifacts-${{ github.run_id }}
          path: |
            rust/fuzz/artifacts/**
            rust/fuzz/corpus/**
          retention-days: 90
          if-no-files-found: warn

  go-fuzz:
    name: Go Fuzzing
    runs-on: ubuntu-latest
    needs: rust-fuzz
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Run longer Go fuzz sessions
        continue-on-error: true
        working-directory: go
        run: |
          echo "Starting Go fuzzing (decode_raw)..."
          go test -fuzz=FuzzDecodeRaw -fuzztime=5m ./... || true
          echo "Starting Go fuzzing (roundtrip)..."
          go test -fuzz=FuzzRoundtrip -fuzztime=5m ./... || true

      - name: Upload Go fuzz artifacts (if any)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: go-fuzz-artifacts-${{ github.run_id }}
          path: go/**
          retention-days: 30
          if-no-files-found: warn

  summary:
    name: Fuzzing Summary
    runs-on: ubuntu-latest
    needs: [rust-fuzz, go-fuzz]
    if: always()
    steps:
      - name: Print summary
        run: |
          echo "Fuzzing run completed."
          echo "Check the 'Artifacts' section for any crashing inputs found."